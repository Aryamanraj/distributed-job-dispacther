upstream coordinators {
    # Round-robin across all three coordinator replicas
    server coordinator-1:8080;
    server coordinator-2:8080;
    server coordinator-3:8080;
}

# Upgrade maps for WebSocket proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # HTTP API (jobs, stats, chaos, health)
    location / {
        proxy_pass         http://coordinators;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Reasonable timeouts for REST calls
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # WebSocket upgrade path — workers connect here
    location /ws {
        proxy_pass         http://coordinators;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket connections are long-lived
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
