upstream coordinators {
    server coordinator-1:8080 max_fails=1 fail_timeout=2s;
    server coordinator-2:8080 max_fails=1 fail_timeout=2s;
    server coordinator-3:8080 max_fails=1 fail_timeout=2s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        proxy_pass         http://coordinators;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Reasonable timeouts for REST calls
        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }

    location /ws {
        proxy_pass         http://coordinators;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
