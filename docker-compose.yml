version: "3.9"

# ---------------------------------------------------------------------------
# Shared coordinator environment (merged per-service with unique ID/port)
# ---------------------------------------------------------------------------
x-coordinator-base: &coordinator-base
  build:
    context: .
    dockerfile: Dockerfile.coordinator
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    NODE_ENV: production
    LOG_LEVEL: info
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: dispatcher
    DB_USER: postgres
    DB_PASS: postgres

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispatcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Coordinators ───────────────────────────────────────────────────────────
  coordinator-1:
    <<: *coordinator-base
    ports:
      - "8081:8080"   # exposed for direct chaos/stats access by harness
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dispatcher
      DB_USER: postgres
      DB_PASS: postgres
      PORT: "8080"
      COORDINATOR_ID: "1"

  coordinator-2:
    <<: *coordinator-base
    ports:
      - "8082:8080"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dispatcher
      DB_USER: postgres
      DB_PASS: postgres
      PORT: "8080"
      COORDINATOR_ID: "2"

  coordinator-3:
    <<: *coordinator-base
    ports:
      - "8083:8080"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dispatcher
      DB_USER: postgres
      DB_PASS: postgres
      PORT: "8080"
      COORDINATOR_ID: "3"

  # ── Nginx load balancer ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - coordinator-1
      - coordinator-2
      - coordinator-3
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  # ── Workers ────────────────────────────────────────────────────────────────
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: worker-1
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "4"
      RECONNECT_DELAY_MS: "2000"

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: worker-2
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "4"
      RECONNECT_DELAY_MS: "2000"

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: worker-3
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "4"
      RECONNECT_DELAY_MS: "2000"

  worker-4:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: worker-4
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "4"
      RECONNECT_DELAY_MS: "2000"

  worker-5:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: worker-5
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "4"
      RECONNECT_DELAY_MS: "2000"

volumes:
  pgdata:
