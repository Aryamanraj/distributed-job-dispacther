version: "3.9"

# ---------------------------------------------------------------------------
# Shared coordinator environment (merged per-service with unique ID/port)
# ---------------------------------------------------------------------------
x-coordinator-base: &coordinator-base
  build:
    context: .
    dockerfile: Dockerfile.coordinator
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    NODE_ENV: production
    LOG_LEVEL: info
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: dispatcher
    DB_USER: postgres
    DB_PASS: postgres

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dispatcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Coordinators ───────────────────────────────────────────────────────────
  coordinator-1:
    <<: *coordinator-base
    container_name: c1
    ports:
      - "127.0.0.2:8080:8080"
      - "8081:8080"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dispatcher
      DB_USER: postgres
      DB_PASS: postgres
      PORT: "8080"
      COORDINATOR_ID: "c1"

  coordinator-2:
    <<: *coordinator-base
    container_name: c2
    ports:
      - "127.0.0.3:8080:8080"
      - "8082:8080"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dispatcher
      DB_USER: postgres
      DB_PASS: postgres
      PORT: "8080"
      COORDINATOR_ID: "c2"

  coordinator-3:
    <<: *coordinator-base
    container_name: c3
    ports:
      - "127.0.0.4:8080:8080"
      - "8083:8080"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dispatcher
      DB_USER: postgres
      DB_PASS: postgres
      PORT: "8080"
      COORDINATOR_ID: "c3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - coordinator-1
      - coordinator-2
      - coordinator-3
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: w1
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: w1
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "16"
      RECONNECT_DELAY_MS: "2000"

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: w2
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: w2
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "16"
      RECONNECT_DELAY_MS: "2000"

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: w3
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: w3
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "16"
      RECONNECT_DELAY_MS: "2000"

  worker-4:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: w4
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: w4
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "16"
      RECONNECT_DELAY_MS: "2000"

  worker-5:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: w5
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_ID: w5
      COORDINATOR_URL: ws://nginx/ws
      CONCURRENCY_LIMIT: "16"
      RECONNECT_DELAY_MS: "2000"

volumes:
  pgdata:
